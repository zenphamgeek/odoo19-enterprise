<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="arabicaGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4A3020"/>
      <stop offset="50%" stop-color="#2C1810"/>
      <stop offset="100%" stop-color="#1E120B"/>
    </radialGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="200" height="200" rx="32" fill="#1E120B"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(212,136,66,0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Coffee Bean Silhouette -->
  <g transform="rotate(20 100 100)">
    <ellipse cx="100" cy="100" rx="42" ry="72" fill="url(#arabicaGrad)" stroke="#D48842" stroke-width="2"/>
    <!-- S-Curve Crevice of Specialty Arabica -->
    <path d="M 100 32 C 114 62, 86 138, 100 168" fill="none" stroke="#E5A93C" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 101 36 C 115 65, 87 135, 101 164" fill="none" stroke="#120A06" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Jasmine flower accent -->
  <circle cx="150" cy="50" r="5" fill="#FAF6F0"/>
  <circle cx="150" cy="42" r="3" fill="#FAF6F0" opacity="0.8"/>
  <circle cx="158" cy="50" r="3" fill="#FAF6F0" opacity="0.8"/>
  <circle cx="150" cy="58" r="3" fill="#FAF6F0" opacity="0.8"/>
  <circle cx="142" cy="50" r="3" fill="#FAF6F0" opacity="0.8"/>
  <circle cx="150" cy="50" r="2" fill="#E5A93C"/>
  <!-- Tag badge -->
  <rect x="24" y="152" width="152" height="28" rx="14" fill="#2C1810" stroke="rgba(212,136,66,0.4)" stroke-width="1"/>
  <text x="100" y="170" text-anchor="middle" fill="#E5A93C" font-family="sans-serif" font-size="11" font-weight="bold">BOURBON WASHED</text>
</svg>
