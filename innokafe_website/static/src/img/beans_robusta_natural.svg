<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="robustaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3C2415"/>
      <stop offset="50%" stop-color="#23130C"/>
      <stop offset="100%" stop-color="#120A06"/>
    </radialGradient>
    <linearGradient id="cremaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#D48842"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="200" height="200" rx="32" fill="#1E120B"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(212,136,66,0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Coffee Bean Silhouette -->
  <g transform="rotate(-25 100 100)">
    <ellipse cx="100" cy="100" rx="46" ry="68" fill="url(#robustaGrad)" stroke="#D48842" stroke-width="2"/>
    <!-- Center Crevice Curve -->
    <path d="M 100 36 C 88 65, 114 135, 100 164" fill="none" stroke="#E5A93C" stroke-width="4" stroke-linecap="round"/>
    <path d="M 98 42 C 86 70, 112 130, 98 158" fill="none" stroke="#120A06" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Fine Robusta Natural Accent -->
  <rect x="24" y="152" width="152" height="28" rx="14" fill="#2C1810" stroke="rgba(212,136,66,0.4)" stroke-width="1"/>
  <text x="100" y="170" text-anchor="middle" fill="#E5A93C" font-family="sans-serif" font-size="11" font-weight="bold">FINE ROBUSTA NATURAL</text>
</svg>
