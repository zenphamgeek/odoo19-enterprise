<?xml version="1.0" encoding="utf-8"?>
<!-- InnoKafe Specialty Coffee - Brand Mark Symbol -->
<!-- Square Canvas: 512 x 512 | Centered Bean & 3 Botanical Sprouts -->
<svg version="1.1" id="InnoKafe_Mark_Symbol" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512"
     width="100%" height="100%" xml:space="preserve" role="img"
     aria-label="InnoKafe Brand Mark Symbol">
  <defs>
    <linearGradient id="innoMarkShimmerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFD180" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="60%" stop-color="#FFD180" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF8000" stop-opacity="0"/>
    </linearGradient>

    <filter id="innoMarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style type="text/css">
      .inno-mark-bean { fill: #FF8000; fill-rule: evenodd; }
      .inno-mark-sprout { fill: #FF8000; }
      
      .inno-sprout-left {
        transform-origin: 355px 44px;
        animation: innoSproutLeftPulse 3.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      }
      .inno-sprout-center {
        transform-origin: 387px 42px;
        animation: innoSproutCenterPulse 3.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite 0.25s;
      }
      .inno-sprout-right {
        transform-origin: 415px 44px;
        animation: innoSproutRightPulse 3.2s cubic-bezier(0.4, 0.0, 0.2, 1) infinite 0.5s;
      }
      
      @keyframes innoSproutLeftPulse {
        0%, 100% { transform: scale(1.0) rotate(0deg); }
        50% { transform: scale(1.05) rotate(-1.5deg); }
      }
      @keyframes innoSproutCenterPulse {
        0%, 100% { transform: scale(1.0) translateY(0); }
        50% { transform: scale(1.06) translateY(-2px); }
      }
      @keyframes innoSproutRightPulse {
        0%, 100% { transform: scale(1.0) rotate(0deg); }
        50% { transform: scale(1.05) rotate(1.5deg); }
      }

      .inno-mark-shimmer {
        stroke: url(#innoMarkShimmerGrad);
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-dasharray: 45 125;
        stroke-dashoffset: 170;
        filter: url(#innoMarkGlow);
        animation: innoShimmerLoop 2.8s ease-in-out infinite;
      }
      @keyframes innoShimmerLoop {
        0% { stroke-dashoffset: 170; opacity: 0; }
        20% { opacity: 0.95; }
        80% { opacity: 0.95; }
        100% { stroke-dashoffset: -170; opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .inno-sprout-left, .inno-sprout-center, .inno-sprout-right, .inno-mark-shimmer {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 0 !important;
        }
      }
    </style>
  </defs>

  <g transform="translate(256, 256) scale(2.4) translate(-370, -80.75)">
    <!-- Coffee Bean with S-Groove -->
    <path class="inno-mark-bean" fill-rule="evenodd" d="M426.6,79.7c-2.6-12-9.8-20.6-21.4-26s-25.1-6.3-40.5-2.9C344.9,55.3,329,65,317.2,80s-15.9,30.9-12.1,47.7    c2.8,12.7,10.1,21.8,21.7,27.4c11.7,5.6,24.9,6.7,39.8,3.3c18.9-4.2,34.5-14.3,46.9-30.2C426,112.2,430.3,96,426.6,79.7z     M365.6,117.5c-29,42.8-54.2,16-54.2,16s18.8,4.8,36.1-23.4C384.1,41.2,420.3,76,420.3,76C393.4,74.8,388.9,83,365.6,117.5    L365.6,117.5z"/>
    
    <!-- Shimmer path on S-groove -->
    <path class="inno-mark-shimmer"
          d="M 314 133 C 330 148, 355 125, 366 117 C 378 108, 400 70, 420 76"
          fill="none"/>

    <!-- 3 Sprouts -->
    <g class="inno-sprout-left">
      <path class="inno-mark-sprout" d="M342.3,15.1c1.6-1.4,3.9-1.6,7-0.6c3.5,1.4,6.7,3.5,9.3,6.3c3.9,3.8,6.9,8.4,8.6,13.6c1.4,4.6,0.9,7.6-1.4,9    c-1.8,1.1-4.2,1-7.4-0.3c-3.5-1.6-6.6-3.9-9.1-6.8c-4-4.2-6.6-8.3-8-12.4S340.2,16.9,342.3,15.1z"/>
    </g>
    <g class="inno-sprout-center">
      <path class="inno-mark-sprout" d="M395.9,0.8c3.1,0.9,5,3.5,5.7,7.6s0,8.8-2,13.9c-2.6,6.7-6.3,11.8-10.8,15.4c-4.3,3.4-7.9,4.3-11,2.9    c-2.4-1.1-3.9-3.3-4.6-6.7s-0.3-7.5,1.1-12.2c1.7-6,4.8-11.5,9.1-16C387.8,1.4,391.9-0.3,395.9,0.8z"/>
    </g>
    <g class="inno-sprout-right">
      <path class="inno-mark-sprout" d="M436.6,24.2c2,1.8,2,4.1-0.2,6.9s-5.6,5.2-10.4,7.5c-5.7,2.8-11.9,4.6-18.2,5.3c-5.6,0.6-9.4,0-11.5-1.7    c-1.6-1.4-1.9-3.1-0.6-5.4s3.9-4.7,8-7.2c5.7-3.4,12-5.8,18.5-7C429,21.4,433.9,21.9,436.6,24.2z"/>
    </g>
  </g>
</svg>