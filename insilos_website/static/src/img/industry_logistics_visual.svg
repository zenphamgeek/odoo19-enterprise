<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background: linear-gradient(135deg, #051329 0%, #0B2E64 50%, #071E42 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00BBF9" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3A7E" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#092552" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0077FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="warn-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FB8500" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E4B8A" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#00D2FF" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="url(#grid-pattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#0066FF" opacity="0.15" filter="url(#glow-light)"/>
  <circle cx="750" cy="360" r="180" fill="#00F5D4" opacity="0.12" filter="url(#glow-light)"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="840" height="44" rx="8" fill="#09234B" stroke="#1E5AA8" stroke-width="1.2" filter="url(#shadow-drop)"/>
    <circle cx="24" cy="22" r="6" fill="#00F5D4" filter="url(#glow-light)"/>
    <text x="40" y="27" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">INSILOS MULTI-MODAL LOGISTICS &amp; TRADE ORCHESTRATION ENGINE</text>
    <rect x="670" y="10" width="150" height="24" rx="12" fill="#00357A" stroke="#00D2FF" stroke-width="1"/>
    <text x="745" y="26" fill="#00D2FF" font-size="11" font-weight="600" text-anchor="middle">WCO SAFE COMPLIANT</text>
  </g>

  <!-- Flow Connecting Lines -->
  <path d="M 230 200 L 370 200" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M 530 200 L 670 200" stroke="#00F5D4" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M 450 280 L 450 350" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>
  <path d="M 750 280 L 750 350" stroke="#00F5D4" stroke-width="2" opacity="0.7"/>

  <!-- Node 1: Ingestion & Smart Port Gate -->
  <g transform="translate(60, 120)" filter="url(#shadow-drop)">
    <rect width="180" height="155" rx="12" fill="url(#card-bg)" stroke="url(#glass-edge)" stroke-width="1.5"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#002D66" stroke="#00D2FF" stroke-width="1"/>
    <!-- Anchor/Port Icon -->
    <path d="M 32 23 L 32 37 M 25 31 Q 32 40 39 31 M 27 25 L 37 25" stroke="#00D2FF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="30" fill="#FFFFFF" font-size="14" font-weight="700">Port &amp; Vessel</text>
    <text x="60" y="44" fill="#8ECAE6" font-size="10" font-weight="500">TOS &amp; AIS Telemetry</text>

    <line x1="15" y1="62" x2="165" y2="62" stroke="#1E5AA8" stroke-width="0.8"/>
    
    <text x="15" y="82" fill="#E2E8F0" font-size="11">🚢 Vessel ETA Drift</text>
    <text x="140" y="82" fill="#00F5D4" font-size="10" font-weight="700">Live AIS</text>
    <text x="15" y="104" fill="#E2E8F0" font-size="11">📦 Container Seal &amp; WT</text>
    <text x="140" y="104" fill="#00D2FF" font-size="10" font-weight="700">OCR 4K</text>
    <text x="15" y="126" fill="#E2E8F0" font-size="11">⏱️ D&amp;D Free Time</text>
    <text x="140" y="126" fill="#FFB703" font-size="10" font-weight="700">Auto-Alert</text>

    <rect x="15" y="136" width="150" height="6" rx="3" fill="#051C3E"/>
    <rect x="15" y="136" width="125" height="6" rx="3" fill="#00D2FF"/>
  </g>

  <!-- Node 2: Vertical IDP & 3-Way Reconcile Core -->
  <g transform="translate(360, 110)" filter="url(#shadow-drop)">
    <rect width="200" height="175" rx="14" fill="#092754" stroke="#00F5D4" stroke-width="2"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#003E6B" stroke="#00F5D4" stroke-width="1.2"/>
    <!-- Document Stack Icon -->
    <path d="M 28 24 L 42 24 L 46 28 L 46 44 L 28 44 Z M 34 32 L 40 32 M 34 36 L 42 36 M 34 40 L 38 40" stroke="#00F5D4" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text x="64" y="31" fill="#FFFFFF" font-size="15" font-weight="700">Autonomous IDP</text>
    <text x="64" y="46" fill="#00F5D4" font-size="11" font-weight="600">3-Way Match &amp; Policy</text>

    <line x1="18" y1="64" x2="182" y2="64" stroke="#1E5AA8" stroke-width="0.8"/>

    <g transform="translate(18, 76)">
      <rect width="164" height="24" rx="6" fill="#0E3569"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Bill of Lading vs Inv</text>
      <text x="140" y="16" fill="#00F5D4" font-size="11" font-weight="700">100%</text>
    </g>
    <g transform="translate(18, 106)">
      <rect width="164" height="24" rx="6" fill="#0E3569"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Packing List &amp; C/O</text>
      <text x="140" y="16" fill="#00F5D4" font-size="11" font-weight="700">PASS</text>
    </g>
    <g transform="translate(18, 136)">
      <rect width="164" height="24" rx="6" fill="#0E3569"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Customs Declaration</text>
      <text x="140" y="16" fill="#00D2FF" font-size="11" font-weight="700">Ready</text>
    </g>
  </g>

  <!-- Node 3: Trade Compliance & HS Classification -->
  <g transform="translate(670, 120)" filter="url(#shadow-drop)">
    <rect width="230" height="155" rx="12" fill="url(#card-bg)" stroke="url(#glass-edge)" stroke-width="1.5"/>
    <rect x="16" y="15" width="34" height="34" rx="8" fill="#002D66" stroke="#FFB703" stroke-width="1"/>
    <!-- Scales/Shield Icon -->
    <path d="M 33 22 L 33 38 M 24 26 L 42 26 M 24 33 L 28 33 M 38 33 L 42 33" stroke="#FFB703" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="30" fill="#FFFFFF" font-size="14" font-weight="700">Trade Compliance</text>
    <text x="60" y="44" fill="#FFB703" font-size="10" font-weight="600">8-10 Digit HS &amp; FTA</text>

    <line x1="16" y1="62" x2="214" y2="62" stroke="#1E5AA8" stroke-width="0.8"/>

    <text x="16" y="82" fill="#E2E8F0" font-size="11">🛡️ FTA Origin (EVFTA/CPTPP)</text>
    <text x="185" y="82" fill="#00F5D4" font-size="10" font-weight="700">Valid</text>
    <text x="16" y="104" fill="#E2E8F0" font-size="11">⚖️ HS Code Auto-Classify</text>
    <text x="185" y="104" fill="#00D2FF" font-size="10" font-weight="700">10-Digit</text>
    <text x="16" y="126" fill="#E2E8F0" font-size="11">🚫 Denied Party Screening</text>
    <text x="185" y="126" fill="#00F5D4" font-size="10" font-weight="700">0 Risk</text>
  </g>

  <!-- Bottom Panel: Real-time Multi-Modal KPIs -->
  <g transform="translate(60, 360)" filter="url(#shadow-drop)">
    <rect width="840" height="135" rx="14" fill="#081E3F" stroke="#1E4B8A" stroke-width="1.2"/>
    
    <!-- KPI 1 -->
    <g transform="translate(40, 25)">
      <text x="0" y="18" fill="#8ECAE6" font-size="12" font-weight="600" text-uppercase="true">IDP EXTRACTION SPEED</text>
      <text x="0" y="58" fill="#00F5D4" font-size="34" font-weight="800">&lt; 3.2s</text>
      <text x="0" y="80" fill="#94A3B8" font-size="11">B/L, C/O &amp; Invoice per pack</text>
    </g>

    <line x1="240" y1="20" x2="240" y2="115" stroke="#163A6B" stroke-width="1"/>

    <!-- KPI 2 -->
    <g transform="translate(280, 25)">
      <text x="0" y="18" fill="#8ECAE6" font-size="12" font-weight="600">RECONCILIATION ACCURACY</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="34" font-weight="800">99.8%</text>
      <text x="0" y="80" fill="#00F5D4" font-size="11">Policy 2026.3 Verified</text>
    </g>

    <line x1="510" y1="20" x2="510" y2="115" stroke="#163A6B" stroke-width="1"/>

    <!-- KPI 3 -->
    <g transform="translate(550, 25)">
      <text x="0" y="18" fill="#8ECAE6" font-size="12" font-weight="600">DEMURRAGE / DETENTION RISK</text>
      <text x="0" y="58" fill="#00D2FF" font-size="34" font-weight="800">-88%</text>
      <text x="0" y="80" fill="#94A3B8" font-size="11">Predictive Gate Clearance</text>
    </g>

    <line x1="740" y1="20" x2="740" y2="115" stroke="#163A6B" stroke-width="1"/>

    <!-- KPI 4 -->
    <g transform="translate(770, 25)">
      <text x="0" y="18" fill="#8ECAE6" font-size="12" font-weight="600">CUSTOMS AUDIT</text>
      <text x="0" y="58" fill="#FFB703" font-size="34" font-weight="800">100%</text>
      <text x="0" y="80" fill="#00F5D4" font-size="11">Traceable Dossier</text>
    </g>
  </g>
</svg>
