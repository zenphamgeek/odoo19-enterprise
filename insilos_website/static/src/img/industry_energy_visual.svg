<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background: linear-gradient(135deg, #071724 0%, #0F324C 50%, #091D2F 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="energy-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bolt-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="card-energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#124063" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0A2840" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="edge-energy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-energy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow-energy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>

    <!-- Pattern -->
    <pattern id="grid-energy" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E4E75" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="40" cy="40" r="1.5" fill="#38BDF8" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="960" height="540" fill="url(#grid-energy)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#0284C7" opacity="0.12" filter="url(#glow-energy)"/>
  <circle cx="760" cy="350" r="180" fill="#FACC15" opacity="0.1" filter="url(#glow-energy)"/>

  <!-- Top Title Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="840" height="44" rx="8" fill="#0B2C46" stroke="#1E5C8A" stroke-width="1.2" filter="url(#shadow-energy)"/>
    <circle cx="24" cy="22" r="6" fill="#FACC15" filter="url(#glow-energy)"/>
    <text x="40" y="27" fill="#FFFFFF" font-size="14" font-weight="700" letter-spacing="1">INSILOS RENEWABLE ENERGY &amp; SMART GRID TELEMETRY ENGINE</text>
    <rect x="660" y="10" width="160" height="24" rx="12" fill="#063E5E" stroke="#38BDF8" stroke-width="1"/>
    <text x="740" y="26" fill="#38BDF8" font-size="11" font-weight="600" text-anchor="middle">IEC 61850 &amp; NERC CIP</text>
  </g>

  <!-- Flow Connecting Lines -->
  <path d="M 240 200 L 360 200" stroke="#FACC15" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M 560 200 L 670 200" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.8"/>
  <path d="M 460 290 L 460 350" stroke="#4ADE80" stroke-width="2" stroke-dasharray="4,4" opacity="0.7"/>

  <!-- Node 1: Wind/Solar Asset Ingestion & SCADA -->
  <g transform="translate(60, 115)" filter="url(#shadow-energy)">
    <rect width="190" height="165" rx="12" fill="url(#card-energy)" stroke="url(#edge-energy)" stroke-width="1.5"/>
    <rect x="15" y="15" width="34" height="34" rx="8" fill="#082A42" stroke="#FACC15" stroke-width="1"/>
    <!-- Wind Turbine / Lightning Icon -->
    <path d="M 32 20 L 32 42 M 32 26 L 40 22 M 32 26 L 24 30" stroke="#FACC15" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="30" fill="#FFFFFF" font-size="14" font-weight="700">Telemetry SCADA</text>
    <text x="60" y="44" fill="#93C5FD" font-size="10" font-weight="500">Turbines &amp; Inverters</text>

    <line x1="15" y1="62" x2="175" y2="62" stroke="#1E5C8A" stroke-width="0.8"/>
    
    <text x="15" y="82" fill="#E2E8F0" font-size="11">⚡ Solar / Wind Yield</text>
    <text x="150" y="82" fill="#4ADE80" font-size="10" font-weight="700">420 MW</text>
    <text x="15" y="104" fill="#E2E8F0" font-size="11">🔄 Substation IEC 61850</text>
    <text x="150" y="104" fill="#38BDF8" font-size="10" font-weight="700">10ms</text>
    <text x="15" y="126" fill="#E2E8F0" font-size="11">🌡️ Gearbox / Temp Drift</text>
    <text x="150" y="126" fill="#FACC15" font-size="10" font-weight="700">Norm</text>
    <text x="15" y="148" fill="#E2E8F0" font-size="11">📉 Transmission Loss</text>
    <text x="150" y="148" fill="#4ADE80" font-size="10" font-weight="700">-3.4%</text>
  </g>

  <!-- Node 2: Predictive Dispatch & Anomaly Engine -->
  <g transform="translate(360, 105)" filter="url(#shadow-energy)">
    <rect width="200" height="185" rx="14" fill="#0A3353" stroke="#38BDF8" stroke-width="2"/>
    <rect x="18" y="16" width="36" height="36" rx="8" fill="#124A75" stroke="#4ADE80" stroke-width="1.2"/>
    <!-- Grid Network Node Icon -->
    <circle cx="36" cy="34" r="8" stroke="#4ADE80" stroke-width="2" fill="none"/>
    <path d="M 28 34 L 20 34 M 44 34 L 52 34 M 36 26 L 36 18 M 36 42 L 36 50" stroke="#4ADE80" stroke-width="1.5"/>
    <text x="64" y="31" fill="#FFFFFF" font-size="15" font-weight="700">Smart Dispatch</text>
    <text x="64" y="46" fill="#38BDF8" font-size="11" font-weight="600">What-If &amp; Prediction</text>

    <line x1="18" y1="64" x2="182" y2="64" stroke="#1E5C8A" stroke-width="0.8"/>

    <g transform="translate(18, 76)">
      <rect width="164" height="24" rx="6" fill="#0E3E66"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Production Forecast (24h)</text>
      <text x="140" y="16" fill="#4ADE80" font-size="11" font-weight="700">98.2%</text>
    </g>
    <g transform="translate(18, 106)">
      <rect width="164" height="24" rx="6" fill="#0E3E66"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Turbine Anomaly Pre-alert</text>
      <text x="140" y="16" fill="#FACC15" font-size="11" font-weight="700">14 Days</text>
    </g>
    <g transform="translate(18, 136)">
      <rect width="164" height="24" rx="6" fill="#0E3E66"/>
      <text x="8" y="16" fill="#FFFFFF" font-size="11">Grid Balancing Score</text>
      <text x="140" y="16" fill="#38BDF8" font-size="11" font-weight="700">99.8</text>
    </g>
  </g>

  <!-- Node 3: ISO 55000 Asset Health & Maintenance -->
  <g transform="translate(670, 115)" filter="url(#shadow-energy)">
    <rect width="230" height="165" rx="12" fill="url(#card-energy)" stroke="url(#edge-energy)" stroke-width="1.5"/>
    <rect x="16" y="15" width="34" height="34" rx="8" fill="#082A42" stroke="#4ADE80" stroke-width="1"/>
    <!-- Maintenance Wrench / Shield Icon -->
    <path d="M 28 24 L 38 34 M 36 22 A 6 6 0 0 0 26 32 M 38 34 L 42 38" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="60" y="30" fill="#FFFFFF" font-size="14" font-weight="700">Asset Reliability</text>
    <text x="60" y="44" fill="#4ADE80" font-size="10" font-weight="600">ISO 55000 &amp; EAM</text>

    <line x1="16" y1="62" x2="214" y2="62" stroke="#1E5C8A" stroke-width="0.8"/>

    <text x="16" y="82" fill="#E2E8F0" font-size="11">🛠️ Predictive Work Orders</text>
    <text x="185" y="82" fill="#4ADE80" font-size="10" font-weight="700">Auto</text>
    <text x="16" y="104" fill="#E2E8F0" font-size="11">📊 Remaining Useful Life</text>
    <text x="185" y="104" fill="#38BDF8" font-size="10" font-weight="700">Calculated</text>
    <text x="16" y="126" fill="#E2E8F0" font-size="11">🌐 NERC CIP Security Zone</text>
    <text x="185" y="126" fill="#4ADE80" font-size="10" font-weight="700">Isolated</text>
    <text x="16" y="148" fill="#E2E8F0" font-size="11">💰 Spot Market Revenue</text>
    <text x="185" y="148" fill="#FACC15" font-size="10" font-weight="700">+8.5%</text>
  </g>

  <!-- Bottom Panel: Real-time Energy KPIs -->
  <g transform="translate(60, 360)" filter="url(#shadow-energy)">
    <rect width="840" height="135" rx="14" fill="#08253D" stroke="#1E5C8A" stroke-width="1.2"/>
    
    <!-- KPI 1 -->
    <g transform="translate(40, 25)">
      <text x="0" y="18" fill="#93C5FD" font-size="12" font-weight="600">PRODUCTION FORECAST</text>
      <text x="0" y="58" fill="#4ADE80" font-size="34" font-weight="800">98.2%</text>
      <text x="0" y="80" fill="#94A3B8" font-size="11">Hourly Resolution Accuracy</text>
    </g>

    <line x1="240" y1="20" x2="240" y2="115" stroke="#124063" stroke-width="1"/>

    <!-- KPI 2 -->
    <g transform="translate(280, 25)">
      <text x="0" y="18" fill="#93C5FD" font-size="12" font-weight="600">UNPLANNED OUTAGES</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="34" font-weight="800">-62%</text>
      <text x="0" y="80" fill="#38BDF8" font-size="11">Early Anomaly Detection</text>
    </g>

    <line x1="510" y1="20" x2="510" y2="115" stroke="#124063" stroke-width="1"/>

    <!-- KPI 3 -->
    <g transform="translate(550, 25)">
      <text x="0" y="18" fill="#93C5FD" font-size="12" font-weight="600">MARKET DISPATCH VALUE</text>
      <text x="0" y="58" fill="#FACC15" font-size="34" font-weight="800">+12.4%</text>
      <text x="0" y="80" fill="#94A3B8" font-size="11">What-If Revenue Optimizer</text>
    </g>

    <line x1="740" y1="20" x2="740" y2="115" stroke="#124063" stroke-width="1"/>

    <!-- KPI 4 -->
    <g transform="translate(770, 25)">
      <text x="0" y="18" fill="#93C5FD" font-size="12" font-weight="600">SCADA PROTOCOLS</text>
      <text x="0" y="58" fill="#38BDF8" font-size="34" font-weight="800">100%</text>
      <text x="0" y="80" fill="#4ADE80" font-size="11">IEC 61850 Native</text>
    </g>
  </g>
</svg>
