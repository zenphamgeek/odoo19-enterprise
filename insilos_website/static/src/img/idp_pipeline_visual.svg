<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradIdp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051937"/>
      <stop offset="50%" stop-color="#0B2E64"/>
      <stop offset="100%" stop-color="#001026"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" rx="16" fill="url(#bgGradIdp)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="160" y1="0" x2="160" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="480" y1="0" x2="480" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
  </g>

  <!-- Connecting Pipeline Arrows -->
  <g stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.8">
    <path d="M185,300 L260,300" stroke-dasharray="4,4"/>
    <path d="M420,300 L495,300"/>
    <path d="M655,300 L710,300"/>
    <polygon points="262,296 270,300 262,304" fill="#38bdf8"/>
    <polygon points="497,296 505,300 497,304" fill="#38bdf8"/>
    <polygon points="712,296 720,300 712,304" fill="#38bdf8"/>
  </g>

  <!-- Flow 1: Raw Documents Ingestion (Left Column) -->
  <g transform="translate(100, 300)">
    <!-- Document Stack Mockup -->
    <rect x="-70" y="-120" width="140" height="70" rx="8" fill="#0d2448" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="-95" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">BILL OF LADING</text>
    <text text-anchor="middle" y="-78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9">PDF · Multi-page · B/L #882</text>

    <rect x="-70" y="-35" width="140" height="70" rx="8" fill="#0d2448" stroke="#c084fc" stroke-width="1.5"/>
    <text text-anchor="middle" y="-10" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">COMMERCIAL INVOICE</text>
    <text text-anchor="middle" y="7" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9">USD 142,500.00 · Line items</text>

    <rect x="-70" y="50" width="140" height="70" rx="8" fill="#0d2448" stroke="#34d399" stroke-width="1.5"/>
    <text text-anchor="middle" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">PACKING LIST &amp; C/O</text>
    <text text-anchor="middle" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-size="9">420 Packages · 18,400 kg</text>
  </g>

  <!-- Flow 2: Multi-Modal OCR & Table Extraction (Center-Left) -->
  <g transform="translate(345, 300)">
    <rect x="-75" y="-130" width="150" height="260" rx="14" fill="#082046" stroke="#38bdf8" stroke-width="2" filter="url(#glowEffect)"/>
    <circle cx="0" cy="-85" r="28" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="1.5"/>
    <text text-anchor="middle" y="-80" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">OCR</text>
    
    <text text-anchor="middle" y="-35" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">MULTI-MODAL</text>
    <text text-anchor="middle" y="-18" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">AI EXTRACTION</text>

    <!-- Table grid mockup -->
    <rect x="-55" y="10" width="110" height="15" rx="3" fill="#1e3a66"/>
    <rect x="-55" y="32" width="110" height="15" rx="3" fill="#1e3a66"/>
    <rect x="-55" y="54" width="110" height="15" rx="3" fill="#1e3a66"/>

    <text text-anchor="middle" y="95" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">● Confidence: 99.82%</text>
    <text text-anchor="middle" y="112" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9">Cell Bounding Boxes</text>
  </g>

  <!-- Flow 3: 3-Way Policy Reconciliation Engine (Center-Right) -->
  <g transform="translate(580, 300)">
    <rect x="-85" y="-130" width="170" height="260" rx="14" fill="#082046" stroke="#34d399" stroke-width="2" filter="url(#glowEffect)"/>
    <circle cx="0" cy="-85" r="28" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.5"/>
    <text text-anchor="middle" y="-80" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">3-WAY</text>

    <text text-anchor="middle" y="-35" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">POLICY PACK 2026.3</text>
    <text text-anchor="middle" y="-18" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">RECONCILIATION</text>

    <rect x="-65" y="10" width="130" height="22" rx="4" fill="#0b2e64" stroke="#34d399" stroke-width="1"/>
    <text text-anchor="middle" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5">✓ B/L vs Inv: Matched</text>

    <rect x="-65" y="38" width="130" height="22" rx="4" fill="#0b2e64" stroke="#34d399" stroke-width="1"/>
    <text text-anchor="middle" y="53" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5">✓ Net/Gross Wt: Valid</text>

    <rect x="-65" y="66" width="130" height="22" rx="4" fill="#0b2e64" stroke="#38bdf8" stroke-width="1"/>
    <text text-anchor="middle" y="81" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5">✓ C/O Form: Verified</text>

    <text text-anchor="middle" y="112" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10">0 Mismatch Detected</text>
  </g>

  <!-- Flow 4: Enterprise Sync Output (Right) -->
  <g transform="translate(745, 300)">
    <rect x="-25" y="-90" width="50" height="180" rx="8" fill="#0b2e64" stroke="#38bdf8" stroke-width="1.5"/>
    <text transform="rotate(-90)" x="-0" y="6" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="11">ERP / WMS / TMS</text>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 50)">
    <text text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">INSILOS MULTI-MODAL LOGISTICS IDP PIPELINE</text>
    <text text-anchor="middle" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Autonomous Cross-Document Reconciliation &amp; Audit Lineage</text>
  </g>

  <!-- Bottom Metric Summary Bar -->
  <g transform="translate(400, 550)">
    <rect x="-350" y="-22" width="700" height="44" rx="10" fill="rgba(11,46,100,0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">
      <tspan fill="#34d399" font-weight="bold">-92% Processing Time</tspan> · 
      <tspan fill="#38bdf8" font-weight="bold">99.8% Field Precision</tspan> · 
      <tspan fill="#c084fc" font-weight="bold">100% Immutable Audit Trail</tspan>
    </text>
  </g>
</svg>
