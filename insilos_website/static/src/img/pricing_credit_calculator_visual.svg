<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="pricingBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081A2D" />
      <stop offset="100%" stop-color="#020C17" />
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42E6C3" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="pricingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pr-head { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 14px; }
    .pr-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #8CAAB9; font-size: 11px; }
    .pr-metric { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #42E6C3; font-size: 22px; }
    .pr-badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #42E6C3; letter-spacing: 0.08em; }
  </style>

  <rect width="880" height="540" rx="20" fill="url(#pricingBgGrad)" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(40, 25)">
    <rect width="800" height="48" rx="12" fill="#0A2438" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="24" r="6" fill="#42E6C3" />
    <text x="40" y="29" class="pr-head">TRANSPARENT IAP CREDIT LEDGER &amp; CONSUMPTION ARCHITECTURE</text>
    <text x="560" y="29" class="pr-badge">REAL-TIME QUOTA • NO HIDDEN FEES</text>
  </g>

  <!-- LEFT: INTERACTIVE USAGE & CREDIT LEDGER BREAKDOWN -->
  <g transform="translate(40, 88)">
    <rect width="490" height="290" rx="16" fill="#051726" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="25" y="32" class="pr-head" font-size="13">Enterprise Credit Allocation &amp; Unit Economics</text>
    <text x="25" y="48" class="pr-sub">Micro-Ledger Billing per Operation with Real-Time Refund on Validation Error</text>

    <!-- Usage Bars -->
    <g transform="translate(30, 75)">
      <!-- Item 1: IDP Multi-Modal OCR & Policy 2026.3 -->
      <text x="0" y="14" font-family="Inter" font-weight="700" font-size="10" fill="#FFFFFF">IDP Document Processing (PDF/Image)</text>
      <text x="350" y="14" font-family="Inter" font-weight="700" font-size="10" fill="#42E6C3">0.05 Credits / page</text>
      <rect y="24" width="430" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect y="24" width="310" height="8" rx="4" fill="url(#tokenGrad)" />

      <!-- Item 2: Knowledge Graph Semantic Query -->
      <text x="0" y="60" font-family="Inter" font-weight="700" font-size="10" fill="#FFFFFF">Knowledge Graph Entity Resolution</text>
      <text x="350" y="60" font-family="Inter" font-weight="700" font-size="10" fill="#00E5FF">0.02 Credits / query</text>
      <rect y="70" width="430" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect y="70" width="220" height="8" rx="4" fill="#00E5FF" />

      <!-- Item 3: Trade Compliance & HS Classification -->
      <text x="0" y="106" font-family="Inter" font-weight="700" font-size="10" fill="#FFFFFF">Automated HS Classification &amp; ROO</text>
      <text x="350" y="106" font-family="Inter" font-weight="700" font-size="10" fill="#238CFF">0.08 Credits / item</text>
      <rect y="116" width="430" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect y="116" width="180" height="8" rx="4" fill="#238CFF" />

      <!-- Item 4: FSM IoT Telemetry & Dispatch -->
      <text x="0" y="152" font-family="Inter" font-weight="700" font-size="10" fill="#FFFFFF">Predictive IoT Asset Stream (24/7)</text>
      <text x="350" y="152" font-family="Inter" font-weight="700" font-size="10" fill="#FFD166">1.50 Credits / asset / mo</text>
      <rect y="162" width="430" height="8" rx="4" fill="rgba(255,255,255,0.08)" />
      <rect y="162" width="140" height="8" rx="4" fill="#FFD166" />
    </g>
  </g>

  <!-- RIGHT: COST SAVINGS & ROI METRICS -->
  <g transform="translate(545, 88)">
    <!-- Metric 1: Cost Reduction vs Manual Ops -->
    <g transform="translate(0, 0)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="pr-sub">TOTAL COST OF OWNERSHIP (TCO)</text>
      <text x="20" y="62" class="pr-metric">-68.5%</text>
      <text x="135" y="60" class="pr-sub" fill="#66DDFF">vs Manual BPO Outsourcing</text>
    </g>

    <!-- Metric 2: Payback Period -->
    <g transform="translate(0, 101)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="pr-sub">TYPICAL PILOT PAYBACK PERIOD</text>
      <text x="20" y="62" class="pr-metric" fill="#238CFF">&lt; 4.2 Mo</text>
      <text x="125" y="60" class="pr-sub" fill="#FFFFFF">Full ROI Realized</text>
    </g>

    <!-- Metric 3: Enterprise SLA Guarantee -->
    <g transform="translate(0, 202)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="pr-sub">UPTIME &amp; FINANCIAL SLA</text>
      <text x="20" y="62" class="pr-metric" fill="#00E5FF">99.95%</text>
      <text x="120" y="60" class="pr-sub" fill="#42E6C3">Backed by Credits</text>
    </g>
  </g>

  <!-- BOTTOM: PRICING GOVERNANCE -->
  <g transform="translate(40, 395)">
    <rect width="800" height="120" rx="14" fill="#071928" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Step 1 -->
    <g transform="translate(25, 25)">
      <text x="0" y="16" class="pr-head" font-size="12">1. Predictable Ledger</text>
      <text x="0" y="34" class="pr-sub">No surge pricing or arbitrary token fees</text>
    </g>
    <line x1="240" y1="20" x2="240" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 2 -->
    <g transform="translate(265, 25)">
      <text x="0" y="16" class="pr-head" font-size="12">2. Rollover Unused Credits</text>
      <text x="0" y="34" class="pr-sub">12-Month credit validity with auto-topup controls</text>
    </g>
    <line x1="510" y1="20" x2="510" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 3 -->
    <g transform="translate(535, 25)">
      <text x="0" y="16" class="pr-head" font-size="12">3. Sovereign On-Premises</text>
      <text x="0" y="34" class="pr-sub">Fixed annual enterprise licensing available</text>
    </g>
  </g>
</svg>
