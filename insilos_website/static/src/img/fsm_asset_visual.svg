<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b30"/>
      <stop offset="50%" stop-color="#0B2E64"/>
      <stop offset="100%" stop-color="#021020"/>
    </linearGradient>
    <linearGradient id="emeraldGlowFsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGlowFsm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowEffectFsm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="16" fill="url(#bgGradFsm)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Title Header -->
  <g transform="translate(400, 50)">
    <text text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">INSILOS FIELD SERVICE &amp; ASSET OPERATIONS INTELLIGENCE</text>
    <text text-anchor="middle" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="12">IoT Telemetry · Predictive Work Orders · Dynamic Skills Dispatch</text>
  </g>

  <!-- Central Hub: Autonomous Dispatch & Optimization -->
  <g transform="translate(400, 300)">
    <circle r="65" fill="#082046" stroke="#34d399" stroke-width="2.5" filter="url(#glowEffectFsm)"/>
    <circle r="52" fill="rgba(11,46,100,0.8)" stroke="rgba(52,211,153,0.4)" stroke-width="1.5"/>
    <text text-anchor="middle" y="-12" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="13">DISPATCH</text>
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">AI ENGINE</text>
    <text text-anchor="middle" y="24" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10">FTFR: 94.8% (+42%)</text>
  </g>

  <!-- Left Top: IoT Telemetry & Asset Digital Twin -->
  <g transform="translate(180, 200)">
    <rect x="-110" y="-55" width="220" height="110" rx="12" fill="#0c234a" stroke="#38bdf8" stroke-width="1.8" filter="url(#glowEffectFsm)"/>
    <text text-anchor="middle" y="-28" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">ASSET TELEMETRY &amp; IoT</text>
    <text text-anchor="middle" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Turbine #102 · Vibration Alert</text>
    <text text-anchor="middle" y="10" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5">Anomaly: 4.8 mm/s &gt; Threshold</text>
    <text text-anchor="middle" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5">Auto-Trigger Predictive WO #491</text>
  </g>

  <!-- Right Top: Dynamic Skills & Certification Dispatch -->
  <g transform="translate(620, 200)">
    <rect x="-110" y="-55" width="220" height="110" rx="12" fill="#0c234a" stroke="#34d399" stroke-width="1.8" filter="url(#glowEffectFsm)"/>
    <text text-anchor="middle" y="-28" fill="#34d399" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">SKILLS &amp; ROUTE DISPATCH</text>
    <text text-anchor="middle" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Tech: Nguyen Van A (Level 4)</text>
    <text text-anchor="middle" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5">ETA: 24 mins · Optimized Route</text>
    <text text-anchor="middle" y="28" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9.5">Cert: High-Voltage &amp; Wind Systems</text>
  </g>

  <!-- Left Bottom: Mobile Digital Briefing Pack -->
  <g transform="translate(180, 420)">
    <rect x="-110" y="-55" width="220" height="110" rx="12" fill="#0c234a" stroke="#c084fc" stroke-width="1.8" filter="url(#glowEffectFsm)"/>
    <text text-anchor="middle" y="-28" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">DIGITAL BRIEFING PACK</text>
    <text text-anchor="middle" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Mobile SOP &amp; Safety Checklist</text>
    <text text-anchor="middle" y="10" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5">Parts: SKF Bearings #6205 Ready</text>
    <text text-anchor="middle" y="28" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9.5">Step-by-step Interactive Guide</text>
  </g>

  <!-- Right Bottom: Closed-Loop Asset Feedback -->
  <g transform="translate(620, 420)">
    <rect x="-110" y="-55" width="220" height="110" rx="12" fill="#0c234a" stroke="#fbbf24" stroke-width="1.8" filter="url(#glowEffectFsm)"/>
    <text text-anchor="middle" y="-28" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">CLOSED-LOOP ASSET HEALTH</text>
    <text text-anchor="middle" y="-8" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11">Work Complete · Sound Confirmed</text>
    <text text-anchor="middle" y="10" fill="#34d399" font-family="system-ui, sans-serif" font-size="10.5">Reliability Score: 99.4% (+6.2%)</text>
    <text text-anchor="middle" y="28" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9.5">ERP Inventory &amp; MTTR Synced</text>
  </g>

  <!-- Connecting Lines -->
  <g stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="290" y1="230" x2="345" y2="270"/>
    <line x1="510" y1="230" x2="455" y2="270"/>
    <line x1="290" y1="390" x2="345" y2="330"/>
    <line x1="510" y1="390" x2="455" y2="330"/>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(400, 550)">
    <rect x="-350" y="-22" width="700" height="44" rx="10" fill="rgba(11,46,100,0.8)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text text-anchor="middle" y="6" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">
      <tspan fill="#34d399" font-weight="bold">+42% First-Time Fix Rate</tspan> · 
      <tspan fill="#38bdf8" font-weight="bold">-65% Mean Time to Repair</tspan> · 
      <tspan fill="#fbbf24" font-weight="bold">Zero Unplanned Downtime</tspan>
    </text>
  </g>
</svg>
