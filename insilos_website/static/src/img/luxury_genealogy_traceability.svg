<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="luxBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1726" />
      <stop offset="100%" stop-color="#050B14" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="luxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .lx-head { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 14px; }
    .lx-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #A5B4CB; font-size: 11px; }
    .lx-metric { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #D946EF; font-size: 22px; }
    .lx-badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #00E5FF; letter-spacing: 0.08em; }
  </style>

  <rect width="880" height="540" rx="20" fill="url(#luxBgGrad)" stroke="rgba(217, 70, 239, 0.3)" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(40, 25)">
    <rect width="800" height="48" rx="12" fill="#151F32" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="24" r="6" fill="#D946EF" />
    <text x="40" y="29" class="lx-head">HIGH-PRECISION MANUFACTURING &amp; LUXURY SERIAL TRACEABILITY</text>
    <text x="560" y="29" class="lx-badge">SWAROVSKI GENEALOGY • AI OPTICAL</text>
  </g>

  <!-- LEFT: SERIALIZED LOT GENEALOGY GRAPH & DEFECT INSPECTION -->
  <g transform="translate(40, 88)">
    <rect width="490" height="290" rx="16" fill="#0A1220" stroke="rgba(217, 70, 239, 0.3)" stroke-width="1.5" />
    
    <!-- Gemstone / Component Geometry -->
    <g transform="translate(245, 140)">
      <!-- Diamond / Precision Cut Shape -->
      <polygon points="0,-70 55,-25 35,65 -35,65 -55,-25" fill="url(#gemGrad)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85" filter="url(#luxGlow)" />
      <polygon points="0,-70 25,-25 15,65 -15,65 -25,-25" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1" />
      <line x1="-55" y1="-25" x2="55" y2="-25" stroke="#FFFFFF" stroke-width="1" />

      <!-- Optical AI Inspection Crosshairs -->
      <circle cx="0" cy="0" r="45" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="-55" y1="0" x2="-40" y2="0" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="40" y1="0" x2="55" y2="0" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="0" y1="-55" x2="0" y2="-40" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="0" y1="40" x2="0" y2="55" stroke="#00E5FF" stroke-width="1.5" />
    </g>

    <!-- Inspection Pass Tag -->
    <g transform="translate(30, 30)">
      <rect width="130" height="32" rx="8" fill="rgba(66, 230, 195, 0.15)" stroke="#42E6C3" stroke-width="1" />
      <text x="65" y="20" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#42E6C3">GRADE AAA · 0 DEFECT</text>
    </g>

    <!-- Serial Batch Metadata Tag -->
    <g transform="translate(330, 30)">
      <rect width="130" height="32" rx="8" fill="rgba(217, 70, 239, 0.15)" stroke="#D946EF" stroke-width="1" />
      <text x="65" y="20" text-anchor="middle" font-family="Inter" font-weight="700" font-size="10" fill="#FFFFFF">LOT #SW-2026-X99</text>
    </g>
  </g>

  <!-- RIGHT: PRECISION METRICS & COMPLIANCE -->
  <g transform="translate(545, 88)">
    <!-- Metric 1: Optical Defect Detection Accuracy -->
    <g transform="translate(0, 0)">
      <rect width="295" height="88" rx="14" fill="#131D2E" stroke="rgba(217, 70, 239, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="lx-sub">OPTICAL DEFECT DETECTION</text>
      <text x="20" y="62" class="lx-metric">99.94%</text>
      <text x="135" y="60" class="lx-sub" fill="#D946EF">Micro-surface scan</text>
    </g>

    <!-- Metric 2: Full Serial Genealogy Lineage -->
    <g transform="translate(0, 101)">
      <rect width="295" height="88" rx="14" fill="#131D2E" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="lx-sub">END-TO-END GENEALOGY</text>
      <text x="20" y="62" class="lx-metric" fill="#00E5FF">100%</text>
      <text x="110" y="60" class="lx-sub" fill="#FFFFFF">Raw Ingot to Retail Ring</text>
    </g>

    <!-- Metric 3: GxP / ISO 9001 Compliance -->
    <g transform="translate(0, 202)">
      <rect width="295" height="88" rx="14" fill="#131D2E" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="lx-sub">COMPLIANCE &amp; ETHICAL SOURCING</text>
      <text x="20" y="62" class="lx-metric" fill="#42E6C3">PASSED</text>
      <text x="135" y="60" class="lx-sub" fill="#66DDFF">Kimberley &amp; RJC Ready</text>
    </g>
  </g>

  <!-- BOTTOM: TRACEABILITY PIPELINE -->
  <g transform="translate(40, 395)">
    <rect width="800" height="120" rx="14" fill="#0D1726" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Step 1 -->
    <g transform="translate(25, 25)">
      <text x="0" y="16" class="lx-head" font-size="12">1. Raw Material Ingest</text>
      <text x="0" y="34" class="lx-sub">Mined Lot &amp; Ethical Provenance</text>
    </g>
    <line x1="240" y1="20" x2="240" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 2 -->
    <g transform="translate(265, 25)">
      <text x="0" y="16" class="lx-head" font-size="12">2. Precision Cut &amp; AI QA</text>
      <text x="0" y="34" class="lx-sub">Sub-Micron Laser Metrology</text>
    </g>
    <line x1="510" y1="20" x2="510" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 3 -->
    <g transform="translate(535, 25)">
      <text x="0" y="16" class="lx-head" font-size="12">3. Immutable Digital Passport</text>
      <text x="0" y="34" class="lx-sub">NFC / QR Serial Authenticity</text>
    </g>
  </g>
</svg>
