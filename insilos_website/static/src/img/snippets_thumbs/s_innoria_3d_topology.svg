<svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="30" height="30" rx="3" fill="#05101E"/>
<!-- Orbit Rings -->
<ellipse cx="15" cy="15" rx="10.5" ry="5.2" stroke="#2F80ED" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6"/>
<ellipse cx="15" cy="15" rx="5.2" ry="10.5" stroke="#0ABBDB" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.5"/>
<!-- Connecting particle bridges -->
<line x1="15" y1="15" x2="4.5" y2="15" stroke="#B2FFDA" stroke-width="0.7" opacity="0.8"/>
<line x1="15" y1="15" x2="25.5" y2="15" stroke="#FF9C00" stroke-width="0.7" opacity="0.8"/>
<line x1="15" y1="15" x2="15" y2="4.5" stroke="#0ABBDB" stroke-width="0.7" opacity="0.8"/>
<line x1="15" y1="15" x2="15" y2="25.5" stroke="#2F80ED" stroke-width="0.7" opacity="0.8"/>
<!-- Central Sovereign Core -->
<circle cx="15" cy="15" r="2.8" fill="#2F80ED"/>
<circle cx="15" cy="15" r="3.8" stroke="#B2FFDA" stroke-width="0.6" stroke-dasharray="1 1"/>
<!-- 4 Orbiting Satellite Nodes -->
<circle cx="4.5" cy="15" r="1.6" fill="#B2FFDA"/><!-- DIGIFORCE -->
<circle cx="15" cy="4.5" r="1.6" fill="#0ABBDB"/><!-- MOJO AI -->
<circle cx="25.5" cy="15" r="1.6" fill="#FF9C00"/><!-- MOJOVERSE -->
<circle cx="15" cy="25.5" r="1.6" fill="#2F80ED"/><!-- ERP -->
</svg>
