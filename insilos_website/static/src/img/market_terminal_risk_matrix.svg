<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="termBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05121E" />
      <stop offset="100%" stop-color="#02080F" />
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238CFF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#42E6C3" />
    </linearGradient>
    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 229, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 229, 255, 0.0)" />
    </linearGradient>
    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tm-head { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 14px; }
    .tm-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #8CAAB9; font-size: 11px; }
    .tm-metric { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #42E6C3; font-size: 22px; }
    .tm-badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #00E5FF; letter-spacing: 0.08em; }
    .tm-code { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #66DDFF; }
  </style>

  <rect width="880" height="540" rx="20" fill="url(#termBgGrad)" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />

  <!-- TOP HEADER & TERMINAL TITLE -->
  <g transform="translate(40, 25)">
    <rect width="800" height="48" rx="12" fill="#091F30" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="24" r="6" fill="#00E5FF" />
    <text x="40" y="29" class="tm-head">INSILOS CAPITAL MARKETS &amp; TREASURY TERMINAL (AI-LNN)</text>
    <text x="560" y="29" class="tm-badge">REAL-TIME VaR 99% • MULTI-ASSET RISK</text>
  </g>

  <!-- LEFT: LIVE CANDLESTICK / PRICE TRAJECTORY & SHOCK SIMULATION -->
  <g transform="translate(40, 88)">
    <rect width="490" height="290" rx="16" fill="#071928" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />
    
    <!-- Chart Grid -->
    <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
      <line x1="20" y1="60" x2="470" y2="60" />
      <line x1="20" y1="120" x2="470" y2="120" />
      <line x1="20" y1="180" x2="470" y2="180" />
      <line x1="20" y1="240" x2="470" y2="240" />
      <line x1="130" y1="20" x2="130" y2="270" />
      <line x1="250" y1="20" x2="250" y2="270" />
      <line x1="370" y1="20" x2="370" y2="270" />
    </g>

    <!-- Header info inside chart -->
    <text x="25" y="38" font-family="Inter" font-weight="700" font-size="13" fill="#FFFFFF">VN-INDEX / MULTI-CURRENCY PORTFOLIO</text>
    <text x="350" y="38" class="tm-code" fill="#42E6C3">1,787.45 (+0.15%)</text>

    <!-- Area Chart Path -->
    <path d="M 30 220 Q 90 190 140 210 T 250 140 T 360 90 T 460 70 L 460 260 L 30 260 Z" fill="url(#chartAreaGrad)" />
    <!-- Gradient Line Path -->
    <path d="M 30 220 Q 90 190 140 210 T 250 140 T 360 90 T 460 70" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" filter="url(#termGlow)" />

    <!-- Shock Scenario Marker (Market Stress Test) -->
    <circle cx="250" cy="140" r="7" fill="#FFB703" stroke="#FFFFFF" stroke-width="1.5" />
    <g transform="translate(220, 80)">
      <rect width="115" height="34" rx="6" fill="rgba(61, 41, 6, 0.9)" stroke="#FFB703" stroke-width="1" />
      <text x="8" y="15" font-family="Inter" font-weight="700" font-size="9" fill="#FFB703">SHOCK: FX +3.5%</text>
      <text x="8" y="27" font-family="Inter" font-weight="500" font-size="8" fill="#FFFFFF">Hedging Rec Triggered</text>
    </g>

    <!-- Current Live Node -->
    <circle cx="460" cy="70" r="5" fill="#42E6C3" filter="url(#termGlow)" />
  </g>

  <!-- RIGHT: RISK & VALUATION TELEMETRY PANEL -->
  <g transform="translate(545, 88)">
    <!-- Metric 1: Value at Risk (VaR 99% 1-Day) -->
    <g transform="translate(0, 0)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(255, 77, 77, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tm-sub">PORTFOLIO VaR (99% CONFIDENCE)</text>
      <text x="20" y="62" class="tm-metric" fill="#FF4D4D">-1.42%</text>
      <text x="130" y="60" class="tm-sub" fill="#FFFFFF">Max Loss: $428,000</text>
    </g>

    <!-- Metric 2: Liquidity Coverage Ratio (LCR Basel III) -->
    <g transform="translate(0, 101)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tm-sub">LIQUIDITY COVERAGE RATIO (LCR)</text>
      <text x="20" y="62" class="tm-metric">142.8%</text>
      <text x="130" y="60" class="tm-sub" fill="#66DDFF">Basel III Buffer: +42.8%</text>
    </g>

    <!-- Metric 3: Automated FX Hedging Ratio -->
    <g transform="translate(0, 202)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tm-sub">AUTOMATED FX HEDGE RATIO</text>
      <text x="20" y="62" class="tm-metric" fill="#238CFF">95.0%</text>
      <text x="120" y="60" class="tm-sub" fill="#42E6C3">Forward Contracts Live</text>
    </g>
  </g>

  <!-- BOTTOM: GOVERNED DECISION PIPELINE -->
  <g transform="translate(40, 395)">
    <rect width="800" height="120" rx="14" fill="#071928" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Step 1 -->
    <g transform="translate(20, 22)">
      <circle cx="18" cy="18" r="15" fill="#0B2E64" stroke="#00E5FF" stroke-width="1.5" />
      <text x="18" y="23" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#FFFFFF">1</text>
      <text x="44" y="16" class="tm-head" font-size="12">Market Feed Ingest</text>
      <text x="44" y="32" class="tm-sub">Tick FIX Protocol &amp; DNSE</text>
    </g>
    <line x1="205" y1="40" x2="215" y2="40" stroke="#00E5FF" stroke-width="1.5" />

    <!-- Step 2 -->
    <g transform="translate(225, 22)">
      <circle cx="18" cy="18" r="15" fill="#0A332C" stroke="#42E6C3" stroke-width="1.5" />
      <text x="18" y="23" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#42E6C3">2</text>
      <text x="44" y="16" class="tm-head" font-size="12">Exposure &amp; Valuation</text>
      <text x="44" y="32" class="tm-sub">Real-Time Mark-to-Market</text>
    </g>
    <line x1="410" y1="40" x2="420" y2="40" stroke="#42E6C3" stroke-width="1.5" />

    <!-- Step 3 -->
    <g transform="translate(430, 22)">
      <circle cx="18" cy="18" r="15" fill="#3D2906" stroke="#FFB703" stroke-width="1.5" />
      <text x="18" y="23" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#FFB703">3</text>
      <text x="44" y="16" class="tm-head" font-size="12">Risk &amp; Recommendation</text>
      <text x="44" y="32" class="tm-sub">AI LNN Stress Shock Matrix</text>
    </g>
    <line x1="615" y1="40" x2="625" y2="40" stroke="#FFB703" stroke-width="1.5" />

    <!-- Step 4 -->
    <g transform="translate(635, 22)">
      <circle cx="18" cy="18" r="15" fill="#2A0845" stroke="#D946EF" stroke-width="1.5" />
      <text x="18" y="23" text-anchor="middle" font-family="Inter" font-weight="800" font-size="11" fill="#D946EF">4</text>
      <text x="44" y="16" class="tm-head" font-size="12">Human Approval &amp; GL</text>
      <text x="44" y="32" class="tm-sub">Auto Ledger Entry &amp; Audit</text>
    </g>
  </g>
</svg>
