<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="meshBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061625" />
      <stop offset="100%" stop-color="#020911" />
    </linearGradient>
    <linearGradient id="agentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#238CFF" />
    </linearGradient>
    <filter id="meshGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .ma-head { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 14px; }
    .ma-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #8CAAB9; font-size: 11px; }
    .ma-metric { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #42E6C3; font-size: 22px; }
    .ma-badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #00E5FF; letter-spacing: 0.08em; }
  </style>

  <rect width="880" height="540" rx="20" fill="url(#meshBgGrad)" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(40, 25)">
    <rect width="800" height="48" rx="12" fill="#0A2234" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="24" r="6" fill="#42E6C3" />
    <text x="40" y="29" class="ma-head">AUTONOMOUS MULTI-AGENT MESH &amp; OPERATIONAL CONTROL TOWER</text>
    <text x="550" y="29" class="ma-badge">PARALLEL INFERENCE • AUDIT TRAIL v2026.3</text>
  </g>

  <!-- LEFT: MULTI-AGENT TOPOLOGY & INTER-AGENT BUS -->
  <g transform="translate(40, 88)">
    <rect width="490" height="290" rx="16" fill="#051726" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="25" y="32" class="ma-head" font-size="13">Multi-Agent State Machine &amp; Task Coordination</text>
    <text x="25" y="48" class="ma-sub">Decentralized Specialization with Cryptographic State Consensus</text>

    <!-- Mesh Nodes -->
    <g transform="translate(245, 155)">
      <!-- Center: Supervisor Orchestrator Agent -->
      <circle cx="0" cy="0" r="48" fill="#0B2E64" stroke="#00E5FF" stroke-width="2" filter="url(#meshGlow)" />
      <text x="0" y="-8" text-anchor="middle" font-family="Inter" font-weight="900" font-size="10" fill="#00E5FF">SUPERVISOR</text>
      <text x="0" y="6" text-anchor="middle" font-family="Inter" font-weight="700" font-size="8" fill="#FFFFFF">AGENT</text>
      <text x="0" y="20" text-anchor="middle" font-family="Inter" font-weight="500" font-size="7" fill="#42E6C3">State: ACTIVE</text>

      <!-- Connection Lines with Data Flow Pulses -->
      <line x1="0" y1="-48" x2="0" y2="-90" stroke="#42E6C3" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="48" y1="20" x2="130" y2="45" stroke="#238CFF" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="-48" y1="20" x2="-130" y2="45" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="4,4" />

      <!-- Top Node: Extraction & OCR Agent -->
      <g transform="translate(0, -105)">
        <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#09253A" stroke="#42E6C3" stroke-width="1" />
        <text x="0" y="-2" text-anchor="middle" font-family="Inter" font-weight="700" font-size="9" fill="#42E6C3">EXTRACTION AGENT</text>
        <text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="500" font-size="7.5" fill="#8CAAB9">Vision-LLM OCR Pipeline</text>
      </g>

      <!-- Right Node: Trade & HS Policy Agent -->
      <g transform="translate(145, 45)">
        <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#09253A" stroke="#238CFF" stroke-width="1" />
        <text x="0" y="-2" text-anchor="middle" font-family="Inter" font-weight="700" font-size="9" fill="#238CFF">POLICY AGENT</text>
        <text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="500" font-size="7.5" fill="#8CAAB9">WCO Rules &amp; Sanctions</text>
      </g>

      <!-- Left Node: GL Reconciliation Agent -->
      <g transform="translate(-145, 45)">
        <rect x="-65" y="-18" width="130" height="36" rx="8" fill="#09253A" stroke="#00E5FF" stroke-width="1" />
        <text x="0" y="-2" text-anchor="middle" font-family="Inter" font-weight="700" font-size="9" fill="#00E5FF">RECONCILIATION AGENT</text>
        <text x="0" y="10" text-anchor="middle" font-family="Inter" font-weight="500" font-size="7.5" fill="#8CAAB9">3-Way PO/Invoice/GRN</text>
      </g>
    </g>
  </g>

  <!-- RIGHT: AGENT PERFORMANCE METRICS -->
  <g transform="translate(545, 88)">
    <!-- Metric 1: Processing Throughput -->
    <g transform="translate(0, 0)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="ma-sub">PARALLEL AGENT THROUGHPUT</text>
      <text x="20" y="62" class="ma-metric">12,500+</text>
      <text x="135" y="60" class="ma-sub" fill="#66DDFF">Docs / Hour / Node</text>
    </g>

    <!-- Metric 2: Average End-to-End Latency -->
    <g transform="translate(0, 101)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="ma-sub">AGENT CHAIN LATENCY (P95)</text>
      <text x="20" y="62" class="ma-metric" fill="#238CFF">1.82s</text>
      <text x="105" y="60" class="ma-sub" fill="#FFFFFF">Async Redis Mesh</text>
    </g>

    <!-- Metric 3: Human Verification Rate -->
    <g transform="translate(0, 202)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="ma-sub">STRAIGHT-THROUGH (STP) RATE</text>
      <text x="20" y="62" class="ma-metric" fill="#00E5FF">97.4%</text>
      <text x="110" y="60" class="ma-sub" fill="#42E6C3">Zero-Touch Invoicing</text>
    </g>
  </g>

  <!-- BOTTOM: CONTROL TOWER CAPABILITIES -->
  <g transform="translate(40, 395)">
    <rect width="800" height="120" rx="14" fill="#071928" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Step 1 -->
    <g transform="translate(25, 25)">
      <text x="0" y="16" class="ma-head" font-size="12">1. Event-Driven Dispatch</text>
      <text x="0" y="34" class="ma-sub">High-throughput Kafka / Redis Queue</text>
    </g>
    <line x1="240" y1="20" x2="240" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 2 -->
    <g transform="translate(265, 25)">
      <text x="0" y="16" class="ma-head" font-size="12">2. Dual Consensus Validation</text>
      <text x="0" y="34" class="ma-sub">Independent Agent Auditing &amp; Cross-Check</text>
    </g>
    <line x1="510" y1="20" x2="510" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 3 -->
    <g transform="translate(535, 25)">
      <text x="0" y="16" class="ma-head" font-size="12">3. Immutable Ledger Write</text>
      <text x="0" y="34" class="ma-sub">Atomic ERP Commit with Full Lineage</text>
    </g>
  </g>
</svg>
