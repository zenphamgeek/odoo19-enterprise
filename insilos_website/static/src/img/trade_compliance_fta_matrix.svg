<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="tcBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081829" />
      <stop offset="100%" stop-color="#020C17" />
    </linearGradient>
    <linearGradient id="tcNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#238CFF" />
    </linearGradient>
    <filter id="tcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .tc-head { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #FFFFFF; font-size: 14px; }
    .tc-sub { font-family: 'Inter', system-ui, sans-serif; font-weight: 500; fill: #8CAAB9; font-size: 11px; }
    .tc-metric { font-family: 'Inter', system-ui, sans-serif; font-weight: 800; fill: #42E6C3; font-size: 22px; }
    .tc-badge { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 10px; fill: #00E5FF; letter-spacing: 0.08em; }
  </style>

  <rect width="880" height="540" rx="20" fill="url(#tcBgGrad)" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />

  <!-- TOP HEADER -->
  <g transform="translate(40, 25)">
    <rect width="800" height="48" rx="12" fill="#092237" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="25" cy="24" r="6" fill="#00E5FF" />
    <text x="40" y="29" class="tc-head">AUTONOMOUS TRADE COMPLIANCE &amp; FTA ORIGIN REASONING ENGINE</text>
    <text x="560" y="29" class="tc-badge">WCO SAFE • EVFTA/CPTPP/RCEP CERTIFIED</text>
  </g>

  <!-- LEFT: DYNAMIC RULES OF ORIGIN (ROO) & HS CLASSIFICATION TREE -->
  <g transform="translate(40, 88)">
    <rect width="490" height="290" rx="16" fill="#051726" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="25" y="32" class="tc-head" font-size="13">Multi-Tier Rules of Origin (ROO) Decision Graph</text>
    <text x="25" y="48" class="tc-sub">Automated Tariff Shift (CTC) &amp; Regional Value Content (RVC 45%)</text>

    <!-- Interactive Decision Nodes -->
    <g transform="translate(30, 70)">
      <!-- Root Node: Product Bill of Materials (BOM) -->
      <g transform="translate(0, 50)">
        <rect width="120" height="40" rx="8" fill="#0B2E64" stroke="#238CFF" stroke-width="1.5" />
        <text x="12" y="18" font-family="Inter" font-weight="700" font-size="9" fill="#00E5FF">HS 8544.42.90</text>
        <text x="12" y="30" font-family="Inter" font-weight="500" font-size="8" fill="#FFFFFF">Telecom Cable BOM</text>
      </g>

      <!-- Connecting Lines -->
      <line x1="120" y1="70" x2="160" y2="30" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="120" y1="70" x2="160" y2="110" stroke="#42E6C3" stroke-width="1.5" />

      <!-- Branch 1: Tariff Shift (CTC) Rule -->
      <g transform="translate(160, 10)">
        <rect width="135" height="40" rx="8" fill="#082035" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
        <text x="10" y="17" font-family="Inter" font-weight="700" font-size="9" fill="#FFD166">Change in Chapter (CC)</text>
        <text x="10" y="29" font-family="Inter" font-weight="500" font-size="8" fill="#8CAAB9">Pass: Heading 74.08 Shift</text>
      </g>

      <!-- Branch 2: Regional Value Content (RVC) -->
      <g transform="translate(160, 90)">
        <rect width="135" height="40" rx="8" fill="#0A2D3E" stroke="#42E6C3" stroke-width="1.5" filter="url(#tcGlow)" />
        <text x="10" y="17" font-family="Inter" font-weight="700" font-size="9" fill="#42E6C3">RVC Calculation: 52.4%</text>
        <text x="10" y="29" font-family="Inter" font-weight="500" font-size="8" fill="#FFFFFF">&gt; 40% Threshold Required</text>
      </g>

      <!-- Connecting Lines to Final Verdict -->
      <line x1="295" y1="30" x2="335" y2="70" stroke="#00E5FF" stroke-width="1.5" />
      <line x1="295" y1="110" x2="335" y2="70" stroke="#42E6C3" stroke-width="1.5" />

      <!-- Final Verdict Node: C/O Form EUR.1 / CPTPP Qualified -->
      <g transform="translate(335, 45)">
        <rect width="105" height="50" rx="10" fill="#0B3A36" stroke="#42E6C3" stroke-width="2" />
        <text x="10" y="20" font-family="Inter" font-weight="800" font-size="10" fill="#42E6C3">0% DUTY QUALIFIED</text>
        <text x="10" y="34" font-family="Inter" font-weight="600" font-size="8" fill="#FFFFFF">EVFTA Form EUR.1</text>
        <text x="10" y="44" font-family="Inter" font-weight="500" font-size="7" fill="#66DDFF">Audit Hash: #94e2a</text>
      </g>
    </g>

    <!-- Bottom Status -->
    <g transform="translate(25, 255)">
      <rect width="440" height="24" rx="6" fill="rgba(35, 140, 255, 0.1)" />
      <text x="15" y="16" font-family="Inter" font-weight="600" font-size="9" fill="#66DDFF">Sanctions &amp; Dual-Use Screening: 100% CLEAR (OFAC / EU / UN Lists)</text>
    </g>
  </g>

  <!-- RIGHT: TRADE SAVINGS & COMPLIANCE METRICS -->
  <g transform="translate(545, 88)">
    <!-- Metric 1: Tariff Savings -->
    <g transform="translate(0, 0)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(66, 230, 195, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tc-sub">DUTY &amp; TARIFF SAVINGS (FTA)</text>
      <text x="20" y="62" class="tc-metric">+$1.85M</text>
      <text x="135" y="60" class="tc-sub" fill="#66DDFF">14.2% Tariff to 0%</text>
    </g>

    <!-- Metric 2: Customs Clearance Time -->
    <g transform="translate(0, 101)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(35, 140, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tc-sub">DECLARATION PRE-CLEARANCE</text>
      <text x="20" y="62" class="tc-metric" fill="#238CFF">&lt; 15s</text>
      <text x="100" y="60" class="tc-sub" fill="#FFFFFF">Auto Preflight Pass</text>
    </g>

    <!-- Metric 3: Audit Discrepancy Rate -->
    <g transform="translate(0, 202)">
      <rect width="295" height="88" rx="14" fill="#0A2234" stroke="rgba(0, 229, 255, 0.3)" stroke-width="1.5" />
      <text x="20" y="30" class="tc-sub">CUSTOMS AUDIT DISCREPANCY</text>
      <text x="20" y="62" class="tc-metric" fill="#00E5FF">0.00%</text>
      <text x="110" y="60" class="tc-sub" fill="#42E6C3">Zero Penalty Guarantee</text>
    </g>
  </g>

  <!-- BOTTOM: WORKFLOW -->
  <g transform="translate(40, 395)">
    <rect width="800" height="120" rx="14" fill="#071928" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    
    <!-- Step 1 -->
    <g transform="translate(25, 25)">
      <text x="0" y="16" class="tc-head" font-size="12">1. Autonomous HS Classification</text>
      <text x="0" y="34" class="tc-sub">AI Cross-Reference with WCO General Rules (GIR)</text>
    </g>
    <line x1="240" y1="20" x2="240" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 2 -->
    <g transform="translate(265, 25)">
      <text x="0" y="16" class="tc-head" font-size="12">2. Dynamic FTA Optimization</text>
      <text x="0" y="34" class="tc-sub">Evaluates EVFTA vs CPTPP vs RCEP for Lowest Duty</text>
    </g>
    <line x1="510" y1="20" x2="510" y2="100" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Step 3 -->
    <g transform="translate(535, 25)">
      <text x="0" y="16" class="tc-head" font-size="12">3. VNACCS/VCIS Integration</text>
      <text x="0" y="34" class="tc-sub">Instant EDI Transmission &amp; Green Channel Clearance</text>
    </g>
  </g>
</svg>
